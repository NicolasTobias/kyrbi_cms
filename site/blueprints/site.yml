# Portada del panel: acceso directo a las cuatro secciones del sitio.
columns:
  - width: 1/2
    sections:
      proyectos: sections/proyectos
  - width: 1/2
    sections:
      paginas:
        type: pages
        label: Páginas
        create: default
        templates:
          - home
          - proyectos
          - colectivo
          - sobre
          - notas
      informacion:
        type: fields
        fields:
          title:
            label: Nombre del sitio
            type: text
          descripcion:
            label: Descripción por defecto
            type: text
            maxlength: 160
            help: Se usa como meta description cuando una página no tiene la suya.
          email:
            label: Correo de contacto
            type: email
