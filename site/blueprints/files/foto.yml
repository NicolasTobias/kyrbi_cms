title: Fotografía
icon: image

accept:
  mime: image/jpeg, image/webp

columns:
  - width: 1/2
    sections:
      campos:
        type: fields
        fields:
          alt:
            label: Texto alternativo
            type: text
            required: true
            help: Qué se ve, en el idioma que estés editando. No lo dejes vacío.
  - width: 1/2
    sections:
      lugar:
        type: fields
        fields:
          lugar_ano:
            label: Lugar y año
            type: text
            help: Opcional. Sale en la lista al final del proyecto, p. ej. "Segovia, 2026". Si lo dejas vacío, esa foto no sale en la lista.
