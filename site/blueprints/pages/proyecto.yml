title: Proyecto
icon: image

status:
  draft: true
  listed: true

# El nombre va por lugar y tiempo, no por tesis: "Hoyo, 2025–2026".
columns:
  - width: 1/3
    sections:
      campos:
        type: fields
        fields:
          intro:
            label: Introducción (máx. 2 frases)
            type: textarea
            size: small
            maxlength: 240
            buttons: false
            help: Opcional. La mayoría de proyectos no deberían tenerla.
          periodo:
            label: Periodo
            type: text
            width: 1/2
            translate: false
            help: Opcional. Sale en el índice junto al número de fotos, p. ej. 2025–26.
          portada:
            label: Portada (para el índice)
            type: files
            max: 1
            layout: cards
            query: page.images.template('foto')
            translate: false
            uploads:
              template: foto
            help: Si la dejas vacía se usa la primera foto de la serie.
          social:
            label: Imagen para compartir (og:image)
            type: files
            max: 1
            layout: cards
            query: page.images.template('foto')
            translate: false
            help: Opcional. Si la dejas vacía se usa la portada.
          descripcion: fields/descripcion
  - width: 2/3
    sections:
      fotos:
        type: files
        label: Serie
        template: foto
        sortable: true
        layout: cards
        size: small
        info: "{{ file.dimensions }}"
        empty: Todavía no hay fotos
        help: El orden de esta lista es el orden en que se ven. Es una secuencia, no una galería.
