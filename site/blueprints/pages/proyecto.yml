title: Proyecto
icon: image

status:
  draft: true
  listed: true

# El nombre va por lugar y tiempo, no por tesis: "Hoyo, 2025–2026".
columns:
  - width: 1/3
    sections:
      campos:
        type: fields
        fields:
          intro:
            label: Introducción (máx. 2 frases)
            type: textarea
            size: small
            maxlength: 240
            buttons: false
            help: Opcional. La mayoría de proyectos no deberían tenerla.
          portada:
            label: Portada (para el índice)
            type: files
            max: 1
            layout: cards
            query: page.images.template('foto')
            uploads:
              template: foto
            help: Si la dejas vacía se usa la primera foto de la serie.
          descripcion: fields/descripcion
  - width: 2/3
    sections:
      fotos:
        type: files
        label: Serie
        template: foto
        sortable: true
        layout: cards
        size: small
        info: "{{ file.dimensions }}"
        empty: Todavía no hay fotos
        help: El orden de esta lista es el orden en que se ven. Es una secuencia, no una galería.
