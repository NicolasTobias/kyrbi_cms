title: Sobre
icon: user

status:
  draft: true
  listed: true

options:
  changeSlug: false

columns:
  - width: 2/3
    sections:
      texto:
        type: fields
        fields:
          bio:
            label: Frase de presentación
            type: textarea
            size: small
            maxlength: 200
            buttons: false
            help: Se lee grande, justo bajo el título. Una o dos frases.
          texto:
            label: Texto
            type: textarea
            size: medium
            help: Lo que haces de verdad. Sin años de experiencia, sin "capturar momentos".
  - width: 1/3
    sections:
      campos:
        type: fields
        fields:
          retrato:
            label: Retrato
            type: files
            max: 1
            layout: cards
            query: page.images.template('foto')
            translate: false
            uploads:
              template: foto
            help: Opcional. Si no lo hay, el texto ocupa todo el ancho.
          email:
            label: Correo
            type: email
            translate: false
          instagram:
            label: Instagram
            type: text
            translate: false
            before: instagram.com/
            help: Solo el nombre de usuario.
          descripcion: fields/descripcion
